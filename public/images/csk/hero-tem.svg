<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <radialGradient id="vig" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#241c10"/>
      <stop offset="100%" stop-color="#14100a"/>
    </radialGradient>
    <pattern id="rang" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="7" fill="#14100a"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#vig)"/>

  <!-- tấm tem phiếu lớn (đồ họa tự vẽ theo phong cách phiếu lương thực) -->
  <g transform="translate(870,180) rotate(-4)">
    <rect x="-14" y="-14" width="648" height="452" fill="url(#rang)"/>
    <rect x="0" y="0" width="620" height="424" fill="#e8dcbc"/>
    <rect x="14" y="14" width="592" height="396" fill="none" stroke="#6a5232" stroke-width="2"/>
    <rect x="22" y="22" width="576" height="380" fill="none" stroke="#6a5232" stroke-width="0.8" stroke-dasharray="5 4"/>
    <text x="310" y="86" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="34" font-weight="600" letter-spacing="6" fill="#3d2f1a">PHIẾU MUA LƯƠNG THỰC</text>
    <text x="310" y="122" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" letter-spacing="4" fill="#6a5232">CỬA HÀNG LƯƠNG THỰC · KHU PHỐ</text>
    <line x1="60" y1="146" x2="560" y2="146" stroke="#6a5232" stroke-width="1.2"/>
    <text x="80" y="196" font-family="IBM Plex Mono, monospace" font-size="17" fill="#3d2f1a">HỌ VÀ TÊN: ............................</text>
    <text x="80" y="234" font-family="IBM Plex Mono, monospace" font-size="17" fill="#3d2f1a">ĐỊNH LƯỢNG: 13 KG / THÁNG</text>
    <text x="80" y="272" font-family="IBM Plex Mono, monospace" font-size="17" fill="#3d2f1a">CÓ GIÁ TRỊ: QUÝ IV — 1985</text>
    <!-- các ô cắt lẻ -->
    <g font-family="IBM Plex Mono, monospace" font-size="12" fill="#3d2f1a" text-anchor="middle">
      <g transform="translate(80,308)">
        <rect width="88" height="66" fill="none" stroke="#6a5232" stroke-dasharray="4 3"/>
        <text x="44" y="28">GẠO</text><text x="44" y="48">250 g</text>
      </g>
      <g transform="translate(180,308)">
        <rect width="88" height="66" fill="none" stroke="#6a5232" stroke-dasharray="4 3"/>
        <text x="44" y="28">GẠO</text><text x="44" y="48">250 g</text>
      </g>
      <g transform="translate(280,308)">
        <rect width="88" height="66" fill="none" stroke="#6a5232" stroke-dasharray="4 3"/>
        <text x="44" y="28">THỊT</text><text x="44" y="48">100 g</text>
      </g>
      <g transform="translate(380,308)">
        <rect width="88" height="66" fill="none" stroke="#6a5232" stroke-dasharray="4 3"/>
        <text x="44" y="28">DẦU</text><text x="44" y="48">100 g</text>
      </g>
      <g transform="translate(480,308)">
        <rect width="88" height="66" fill="none" stroke="#6a5232" stroke-dasharray="4 3"/>
        <text x="44" y="28">VẢI</text><text x="44" y="48">0,5 m</text>
      </g>
    </g>
    <!-- con dấu đỏ -->
    <g transform="translate(468,180) rotate(12)" opacity="0.75">
      <circle r="64" fill="none" stroke="#b3271e" stroke-width="4"/>
      <circle r="46" fill="none" stroke="#b3271e" stroke-width="1.6"/>
      <text y="7" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="600" fill="#b3271e" letter-spacing="2">ĐÃ CẤP</text>
    </g>
  </g>

  <!-- tem nhỏ mờ phía sau, tạo lớp -->
  <g transform="translate(120,520) rotate(6)" opacity="0.28">
    <rect width="380" height="240" fill="#e8dcbc"/>
    <rect x="10" y="10" width="360" height="220" fill="none" stroke="#6a5232" stroke-width="1.5"/>
    <text x="190" y="60" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="20" letter-spacing="4" fill="#3d2f1a">TEM VẢI 1 MÉT</text>
    <text x="190" y="96" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" fill="#6a5232">BỘ NỘI THƯƠNG · 1978</text>
  </g>
  <g transform="translate(60,120) rotate(-9)" opacity="0.2">
    <rect width="330" height="200" fill="#e8dcbc"/>
    <text x="165" y="56" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" letter-spacing="3" fill="#3d2f1a">SỔ MUA LƯƠNG THỰC</text>
  </g>
</svg>
